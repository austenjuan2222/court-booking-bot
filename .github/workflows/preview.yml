name: Cloud login and court preview
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 5'
permissions:
  contents: read
concurrency:
  group: court-cloud-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_CLOUD_PREVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Automatic login and availability preview (no booking)
        run: python runner.py
        env:
          COURT_USER: ${{ secrets.COURT_USER }}
          COURT_PASSWORD: ${{ secrets.COURT_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
